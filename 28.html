<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recheck - Apply Now</title>
    <style>

.mobile-apply-btn{
    position:fixed;
    bottom:-120px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    max-width:500px;
    z-index:999999;
    transition:all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    opacity:0;
    visibility:hidden;
    padding:0 5%;
    box-sizing:border-box;
}

.mobile-apply-btn.show{
    bottom:16px;
    opacity:1;
    visibility:visible;
}

.mobile-apply-btn:active{
    transform:translateX(-50%) scale(0.98);
}

.mobile-apply-btn img{
    width:100%;
    height:auto;
    display:block;
    border-radius:22px;
    box-shadow:0 12px 35px rgba(0,0,0,0.28);
    transition:box-shadow 0.3s ease;
}

.mobile-apply-btn:hover img{
    box-shadow:0 16px 45px rgba(0,0,0,0.35);
}

/* ONLY MOBILE */

@media(min-width:769px){
    .mobile-apply-btn{
        display:none;
    }
}

/* SMALL MOBILE OPTIMIZATION */
@media(max-width:380px){
    .mobile-apply-btn{
        width:88%;
        bottom:12px;
    }
}

/* LANDSCAPE MOBILE */
@media(max-height:500px){
    .mobile-apply-btn{
        bottom:8px;
        width:85%;
    }
}

    </style>
</head>
<body>
    <!-- Page content would go here -->
    <div style="height: 2000px; background: linear-gradient(to bottom, #f0f0f0, #fff); padding: 20px;">
        <h1>Sample Content</h1>
        <p>Scroll down to see the Apply Now button...</p>
    </div>

    <a href="https://recheck.veritasco.tech/" class="mobile-apply-btn" role="button">
        <img src="https://res.cloudinary.com/dum1lkao3/image/upload/q_auto/f_auto/v1779940278/recheck_veritasco_2_1_wuiwog.png" alt="Apply Now" loading="lazy">
    </a>

<script>

let lastScroll = 0;
const applyBtn = document.querySelector('.mobile-apply-btn');

// Improved scroll handler with debouncing
let scrollTimeout;
window.addEventListener('scroll', () => {
    if(scrollTimeout) clearTimeout(scrollTimeout);
    
    scrollTimeout = setTimeout(() => {
        const currentScroll = window.pageYOffset;

        // SHOW AFTER SCROLL
        if(currentScroll > 250){
            applyBtn.classList.add('show');
        }else{
            applyBtn.classList.remove('show');
        }

        // HIDE ON TOP SCROLL
        if(currentScroll < lastScroll && currentScroll < 120){
            applyBtn.classList.remove('show');
        }

        lastScroll = currentScroll;
    }, 10);
}, { passive: true });

// Prevent text selection on button
applyBtn?.addEventListener('mousedown', (e) => {
    e.preventDefault();
});

</script>
</body>
</html>
